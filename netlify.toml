[build]
  command = "node tools/build-netlify.js"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/supabase-config.js"
  [headers.values]
    Cache-Control = "no-store"
